name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Integration tests (self-skipping without live CUBRID)
        run: |
          echo "::warning title=Integration tests not run against a live CUBRID::tests/integration.test.ts self-skips its database-dependent cases because no CUBRID server is provisioned in this workflow. Only offline cases run here. Run 'npm run test:integration' against a live CUBRID (127.0.0.1:33000, database 'testdb', user 'dba') to exercise the full suite."
          npm run test:integration

      - name: Build
        run: npm run build
