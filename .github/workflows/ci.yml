name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  impact:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test CI impact policy
        run: node --test scripts/test-ci-impact.mjs
      - name: Select validation lanes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git rev-parse --verify HEAD^2 >/dev/null 2>&1 && \
               git -c core.quotePath=false diff --no-renames --name-status HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths.txt"; then
              :
            else
              echo "::warning::PR merge diff unavailable; running all validation"
              : > "$RUNNER_TEMP/changed-paths.txt"
            fi
          else
            : > "$RUNNER_TEMP/changed-paths.txt"
          fi
          node scripts/ci-impact.mjs "$EVENT_NAME" < "$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_OUTPUT"
          {
            echo "### Validation impact"
            echo "Event: $EVENT_NAME"
            echo 'Changed paths and git statuses (empty means fail-closed for PRs):'
            echo '#### Changed files'
            cat "$RUNNER_TEMP/changed-paths.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  docs-check:
    name: Documentation and release notes
    needs: impact
    if: ${{ always() && needs.impact.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate release note format
        run: node scripts/verify-release-notes.mjs --candidate
      - name: Test CI impact classification
        run: node --test scripts/test-ci-impact.mjs

  ci:
    needs: impact
    if: ${{ always() && (github.event_name != 'pull_request' || needs.impact.result != 'success' || needs.impact.outputs.runtime != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        # c8's yargs dependency does not load on Node 26, so that lane runs the
        # same tests without coverage.
        if: matrix.node-version != 26
        run: npm run test:coverage

      - name: Test without coverage
        if: matrix.node-version == 26
        run: npm test

      - name: Integration tests (self-skipping without live CUBRID)
        run: |
          echo "::warning title=Integration tests not run against a live CUBRID::tests/integration.test.ts self-skips its database-dependent cases because no CUBRID server is provisioned in this workflow. Only offline cases run here. Run 'npm run test:integration' against a live CUBRID (127.0.0.1:33000, database 'testdb', user 'dba') to exercise the full suite."
          npm run test:integration

      - name: Build
        run: npm run build

      # Also check archived release notes and the generated changelog for emoji.
      - name: Validate release note format
        if: matrix.node-version == 22
        run: node scripts/verify-release-notes.mjs --candidate

      - name: Public API parser regression tests
        if: matrix.node-version == 22
        run: node --test tests/api-public-surface.test.mjs

      # Declarations come from the same pinned tsup/TypeScript on every lane;
      # run the comparison once to avoid duplicate failures.
      # Prove that a release check cannot report green if the real
      # broker is absent; offline CI intentionally has no broker on port 1.
      - name: Prove required live DB checks reject an absent broker
        if: matrix.node-version == 22
        shell: bash
        run: |
          set -euo pipefail
          if CUBRID_LIVE_REQUIRED=1 CUBRID_TEST_PORT=1 npm run test:integration \
              > "$RUNNER_TEMP/negative-broker-test.log" 2>&1; then
            echo "::error::Required integration suite falsely passed without CUBRID"
            exit 1
          fi
          grep -q "Live CUBRID integration was required but the broker was unreachable" \
            "$RUNNER_TEMP/negative-broker-test.log"
          echo "Confirmed: missing broker causes a hard integration failure"

      - name: Validate release workflow syntax and expressions
        if: matrix.node-version == 22
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            .github/workflows/publish.yml \
            .github/workflows/release-please.yml

      - name: Public API check
        if: matrix.node-version == 22
        run: npm run api:check

      # A wrong BIGINT code must fail for an independent reason; this catches
      # the exact oracle-coupling problem that escaped the native v1.0 release.
      - name: Prove protocol fixture detects a mutated BIGINT wire code
        if: matrix.node-version == 22
        shell: bash
        run: |
          set -euo pipefail
          cp src/protocol/constants.ts "$RUNNER_TEMP/constants-original.ts"
          trap 'cp "$RUNNER_TEMP/constants-original.ts" src/protocol/constants.ts' EXIT
          sed -i 's/^  BIGINT = 21,/  BIGINT = 26,/' src/protocol/constants.ts
          grep -q '^  BIGINT = 26,' src/protocol/constants.ts
          if node --import tsx --test tests/protocol-oracles.test.ts > "$RUNNER_TEMP/wire-mutant.log" 2>&1; then
            echo "::error::Wrong BIGINT wire code unexpectedly passed independent fixture tests"
            exit 1
          fi
          grep -q 'not ok.*literal CCI data-type IDs' "$RUNNER_TEMP/wire-mutant.log"
          echo "Confirmed: BIGINT = 26 is rejected by the independent protocol oracle"

  ci-gate:
    name: CI gate
    if: always()
    needs: [impact, docs-check, ci]
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      IMPACT_RESULT: ${{ needs.impact.result }}
      RUNTIME: ${{ needs.impact.outputs.runtime }}
      DOCS: ${{ needs.impact.outputs.docs }}
      CI_RESULT: ${{ needs.ci.result }}
      DOCS_RESULT: ${{ needs.docs-check.result }}
    steps:
      - name: Require all selected validation lanes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMPACT_RESULT" == success ]] || { echo "::error::CI impact classification failed"; exit 1; }
          if [[ "$EVENT_NAME" != pull_request || "$RUNTIME" != false ]]; then
            [[ "$CI_RESULT" == success ]] || { echo "::error::Required runtime matrix: $CI_RESULT"; exit 1; }
          elif [[ "$CI_RESULT" != skipped && "$CI_RESULT" != success ]]; then
            echo "::error::Unexpected runtime result: $CI_RESULT"
            exit 1
          fi
          if [[ "$DOCS" == true ]]; then
            [[ "$DOCS_RESULT" == success ]] || { echo "::error::Required docs validation: $DOCS_RESULT"; exit 1; }
          elif [[ "$DOCS_RESULT" != skipped && "$DOCS_RESULT" != success ]]; then
            echo "::error::Unexpected docs result: $DOCS_RESULT"
            exit 1
          fi
          echo "Selected validation completed: runtime=$RUNTIME docs=$DOCS"
