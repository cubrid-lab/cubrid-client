name: Prepare reviewed Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Propose version, lockfile and changelog in a Release PR
        uses: googleapis/release-please-action@v4
        with:
          # Configure a restricted GitHub App token for automatic PR CI.
          # With GITHUB_TOKEN, manually rerun CI on generated Release PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
