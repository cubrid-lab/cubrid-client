name: Prepare reviewed Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A GitHub Release alone does not establish npm publication. The exact
      # current version must exist in both registries before proposing another.
      - name: Wait for the current published version before proposing the next
        id: current-version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if ! gh release view "v$version" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::notice::v$version has no GitHub Release; do not generate the next release PR."
            echo "released=false" >> "$GITHUB_OUTPUT"
          elif node scripts/verify-npm-version.mjs "$version"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Exact npm version $version is absent or unverified; do not generate a newer Release PR. Recover the existing immutable version first."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Propose version, lockfile and changelog in a Release PR
        if: steps.current-version.outputs.released == 'true'
        uses: googleapis/release-please-action@v5
        with:
          # Supply a restricted PAT for automatic PR CI (or mint an App token per run).
          # With GITHUB_TOKEN, manually rerun CI on generated Release PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
