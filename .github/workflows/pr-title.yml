name: Check PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Squash merges use the PR title as the commit subject on main.
      # chore(deps) and chore(main) are generated by Dependabot and Release Please.
      - name: Require the commit title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)!?|chore\((deps|main)\)): [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'type: description', without a scope. Got: $TITLE"
            exit 1
          fi
