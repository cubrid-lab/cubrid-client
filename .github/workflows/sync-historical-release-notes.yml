name: Sync published GitHub Release notes

on:
  push:
    branches: [main]
    paths:
      - "docs/releases/**"
      - "scripts/verify-release-notes.mjs"
      - "scripts/release-notes-format.mjs"
      - "tests/release-notes-format.test.mjs"
      - ".github/workflows/sync-historical-release-notes.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check all curated notes and attribution tests
        run: |
          set -euo pipefail
          node --test tests/release-notes-format.test.mjs
          node scripts/verify-release-notes.mjs --candidate
      - name: Update existing published GitHub Release descriptions only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/releases/v*.md; do
            tag=$(basename "$file" .md)
            if ! gh release view "$tag" --repo "$GH_REPO" > /dev/null 2>&1; then
              # v0.2.0 has a tag but no historical GitHub Release page.
              # Do not create or re-tag a release just to synchronize notes.
              echo "::notice::No existing GitHub Release for $tag; retained $file without publishing."
              continue
            fi
            gh release edit "$tag" --repo "$GH_REPO" \
              --title "cubrid-client $tag" \
              --notes-file "$file"
            echo "Synchronized existing published GitHub Release $tag"
          done
