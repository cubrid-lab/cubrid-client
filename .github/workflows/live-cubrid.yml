name: Live CUBRID integration

# Pull requests and pushes to main reach this workflow only through ci.yml,
# whose "CI gate" job requires it whenever a change can affect runtime (#264).
# A path-filtered trigger here would duplicate that run and could never be a
# required check, because a workflow that does not start stays pending.
# release-validation.yml calls it with full_matrix: true.
on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      full_matrix:
        type: boolean
        required: false
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-cubrid:
    name: CUBRID ${{ matrix.cubrid }} live protocol
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Keep pull-request checks useful without downloading four large server
      # images on every code review: a pull request runs 11.4 only. A push to
      # main, a manual dispatch and the release gate run all four versions.
      matrix:
        cubrid: ${{ fromJSON((inputs.full_matrix || github.event_name != 'pull_request') && '["10.2","11.0","11.2","11.4"]' || '["11.4"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start disposable CUBRID broker and database
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cubrid-live \
            -e CUBRID_DB=testdb \
            -p 127.0.0.1:33000:33000 \
            "cubrid/cubrid:${{ matrix.cubrid }}"
      - name: Fail if live database never becomes ready
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 36); do
            # Run csql as the service user, never as root. A root csql that wins
            # the race with the entrypoint's createdb creates $CUBRID/log owned
            # by root; the server then cannot write its logs and reports lock
            # timeouts as -2 instead of -74/-75/-968 (issue #203).
            if docker exec --user cubrid cubrid-live csql -u dba testdb -c "SELECT 1" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            docker logs cubrid-live
            echo "::error::CUBRID ${{ matrix.cubrid }} did not start; this is not a skipped integration test"
            exit 1
          fi
      - name: Record server and broker versions and the image digest
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          image="cubrid/cubrid:${{ matrix.cubrid }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image" || true)
          server=$(docker exec --user cubrid cubrid-live csql -u dba testdb -c "SELECT VERSION()" 2>/dev/null \
            | grep -oE "'[0-9][0-9.]*'" | tr -d "'" | head -1 || true)
          build=$(docker exec --user cubrid cubrid-live bash -lc cubrid_rel | grep -m1 CUBRID || true)
          # getServerVersion() asks the broker's CAS, so this is the version the
          # client actually talks to on port 33000.
          broker=$(node --import tsx --input-type=module -e '
            const { createClient } = await import("./src/index.ts");
            const client = createClient({ host: "127.0.0.1", port: 33000, database: "testdb", user: "dba", password: "" });
            try { console.log(await client.getServerVersion()); } finally { await client.close(); }' || true)
          if [ -z "$digest" ] || [ -z "$server" ] || [ -z "$broker" ] || [ -z "$build" ]; then
            echo "::error::Could not record the image digest, server, broker or build version"
            exit 1
          fi
          {
            echo "### CUBRID ${{ matrix.cubrid }} live lane"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`$image\` |"
            echo "| Image digest | \`$digest\` |"
            echo "| Server version (\`SELECT VERSION()\`) | \`$server\` |"
            echo "| Broker version (\`getServerVersion()\` on port 33000) | \`$broker\` |"
            echo "| Build (\`cubrid_rel\`) | \`$build\` |"
            echo "| Node.js | \`$(node --version)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image=$image digest=$digest server=$server broker=$broker"
      - name: Create a utf8 database for the charset tests (#238)
        shell: bash
        run: |
          set -euo pipefail
          # testdb is iso88591 in these images; the charset tests also need a
          # database created with en_US.utf8. Run as the service user (#203).
          docker exec --user cubrid cubrid-live bash -lc \
            'mkdir -p "$CUBRID_DATABASES/testu8" && cd "$CUBRID_DATABASES/testu8" &&
             cubrid createdb --db-volume-size=20M --log-volume-size=20M testu8 en_US.utf8 &&
             cubrid server start testu8'
          docker exec --user cubrid cubrid-live csql -u dba testu8 -c "SELECT 1" >/dev/null
      - name: Execute non-skippable live integration tests
        timeout-minutes: 15
        env:
          CUBRID_LIVE_REQUIRED: "1"
          CUBRID_TEST_PORT: "33000"
          CUBRID_TEST_UTF8_DATABASE: testu8
        shell: bash
        run: |
          set -euo pipefail
          # CUBRID_LIVE_REQUIRED=1 turns an unreachable broker into a thrown
          # error; a failing test makes the run exit non-zero. Keep the exit
          # status so the counts still reach the summary before failing.
          # Ask for TAP explicitly: Node 23 and later print the spec reporter
          # even when piped, which has no "# tests" lines to check.
          status=0
          node --import tsx --test --test-reporter=tap tests/integration.test.ts 2>&1 \
            | tee live-integration.tap || status=$?
          count() { sed -n "s/^# $1 //p" live-integration.tap | tail -1; }
          tests=$(count tests); passed=$(count pass); failed=$(count fail)
          skipped=$(count skipped); todo=$(count todo); cancelled=$(count cancelled)
          {
            echo "### CUBRID ${{ matrix.cubrid }} live integration tests"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Live tests executed | ${tests:-none} |"
            echo "| Passed / failed / cancelled / skipped / todo | ${passed:-?} / ${failed:-?} / ${cancelled:-?} / ${skipped:-?} / ${todo:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::Live integration run exited with status $status"
            exit 1
          fi
          for value in "$tests" "$passed" "$failed" "$skipped" "$todo" "$cancelled"; do
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "::error::Live test summary missing from TAP output"; exit 1; }
          done
          if [ "$skipped" -ne 0 ] || [ "$todo" -ne 0 ] || grep -Eq '^\s*(not )?ok [0-9]+ - .*# (SKIP|TODO)' live-integration.tap; then
            echo "::error::Live CUBRID tests or suites were skipped"
            exit 1
          fi
          if [ "$failed" -ne 0 ] || [ "$cancelled" -ne 0 ] || [ "$passed" -ne "$tests" ]; then
            echo "::error::Live CUBRID tests did not all pass: $passed of $tests"
            exit 1
          fi
          if [ "$tests" -lt 20 ]; then
            echo "::error::Expected at least 20 live integration tests; got $tests"
            exit 1
          fi
          # The CREATE/INSERT/SELECT/ROLLBACK round trip must have run and passed.
          if ! grep -Eq '^\s*ok [0-9]+ - getServerVersion returns the server version and leaves a transaction.s row to rollback\(\)$' live-integration.tap; then
            echo "::error::The create/insert/rollback/select round trip did not pass"
            exit 1
          fi
          echo "Live CUBRID ${{ matrix.cubrid }}: $passed of $tests tests passed, 0 skipped"
      - name: Checkout original node-cubrid driver at reviewed source revision
        uses: actions/checkout@v7
        with:
          repository: CUBRID/node-cubrid
          ref: 89733f0a9a8f3d9796f65b46a1f4694fed683340
          path: legacy-node-cubrid
          persist-credentials: false
      - name: Install legacy driver runtime dependencies only
        run: npm install --prefix legacy-node-cubrid --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Compare legacy and native SQL behavior against this broker
        env:
          CUBRID_LIVE_REQUIRED: "1"
          CUBRID_TEST_PORT: "33000"
          NODE_CUBRID_ENTRY: ${{ github.workspace }}/legacy-node-cubrid/index.js
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test --test-reporter=tap tests/legacy-parity.test.ts 2>&1 | tee legacy-parity.tap
          grep -q '^# tests 1$' legacy-parity.tap
          grep -q '^# pass 1$' legacy-parity.tap
          grep -q '^# fail 0$' legacy-parity.tap
          grep -q '^# skipped 0$' legacy-parity.tap
      - name: Print failed container logs
        if: failure()
        run: docker logs cubrid-live || true
      - name: Remove disposable database
        if: always()
        run: docker rm -f cubrid-live >/dev/null 2>&1 || true
