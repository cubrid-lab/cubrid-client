name: Live CUBRID integration

on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      full_matrix:
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/integration.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/live-cubrid.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/integration.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/live-cubrid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-cubrid:
    name: CUBRID ${{ matrix.cubrid }} live protocol
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Keep pull-request checks useful without downloading four large server
      # images on every code review. Full compatibility matrix runs on main
      # and can also be invoked manually before a release.
      matrix:
        cubrid: ${{ fromJSON((inputs.full_matrix || github.event_name != 'pull_request') && '["10.2","11.0","11.2","11.4"]' || '["11.4"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start disposable CUBRID broker and database
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cubrid-live \
            -e CUBRID_DB=testdb \
            -p 127.0.0.1:33000:33000 \
            "cubrid/cubrid:${{ matrix.cubrid }}"
      - name: Fail if live database never becomes ready
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 36); do
            # Run csql as the service user, never as root. A root csql that wins
            # the race with the entrypoint's createdb creates $CUBRID/log owned
            # by root; the server then cannot write its logs and reports lock
            # timeouts as -2 instead of -74/-75/-968 (issue #203).
            if docker exec --user cubrid cubrid-live csql -u dba testdb -c "SELECT 1" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            docker logs cubrid-live
            echo "::error::CUBRID ${{ matrix.cubrid }} did not start; this is not a skipped integration test"
            exit 1
          fi
          docker inspect --format '{{.Config.Image}}' cubrid-live
      - name: Create a utf8 database for the charset tests (#238)
        shell: bash
        run: |
          set -euo pipefail
          # testdb is iso88591 in these images; the charset tests also need a
          # database created with en_US.utf8. Run as the service user (#203).
          docker exec --user cubrid cubrid-live bash -lc \
            'mkdir -p "$CUBRID_DATABASES/testu8" && cd "$CUBRID_DATABASES/testu8" &&
             cubrid createdb --db-volume-size=20M --log-volume-size=20M testu8 en_US.utf8 &&
             cubrid server start testu8'
          docker exec --user cubrid cubrid-live csql -u dba testu8 -c "SELECT 1" >/dev/null
      - name: Execute non-skippable live integration tests
        env:
          CUBRID_LIVE_REQUIRED: "1"
          CUBRID_TEST_PORT: "33000"
          CUBRID_TEST_UTF8_DATABASE: testu8
        shell: bash
        run: |
          set -euo pipefail
          npm run test:integration 2>&1 | tee live-integration.tap
          if grep -Eq '^# skipped [1-9]' live-integration.tap; then
            echo "::error::Live CUBRID tests were skipped"
            exit 1
          fi
          passed=$(sed -n 's/^# pass //p' live-integration.tap | tail -1)
          if [ -z "$passed" ] || [ "$passed" -lt 20 ]; then
            echo "::error::Expected at least 20 live integration assertions; got ${passed:-none}"
            exit 1
          fi
      - name: Checkout original node-cubrid driver at reviewed source revision
        uses: actions/checkout@v7
        with:
          repository: CUBRID/node-cubrid
          ref: 89733f0a9a8f3d9796f65b46a1f4694fed683340
          path: legacy-node-cubrid
          persist-credentials: false
      - name: Install legacy driver runtime dependencies only
        run: npm install --prefix legacy-node-cubrid --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Compare legacy and native SQL behavior against this broker
        env:
          CUBRID_LIVE_REQUIRED: "1"
          CUBRID_TEST_PORT: "33000"
          NODE_CUBRID_ENTRY: ${{ github.workspace }}/legacy-node-cubrid/index.js
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/legacy-parity.test.ts 2>&1 | tee legacy-parity.tap
          grep -q '^# tests 1$' legacy-parity.tap
          grep -q '^# pass 1$' legacy-parity.tap
          grep -q '^# fail 0$' legacy-parity.tap
          grep -q '^# skipped 0$' legacy-parity.tap
      - name: Print failed container logs
        if: failure()
        run: docker logs cubrid-live || true
      - name: Remove disposable database
        if: always()
        run: docker rm -f cubrid-live >/dev/null 2>&1 || true
