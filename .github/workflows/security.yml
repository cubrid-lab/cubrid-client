name: Security Scans

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # Covers devDependencies on purpose: this package has no runtime
      # dependencies, so --omit=dev would always pass, and the build tools
      # produce the published files. See SECURITY.md.
      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run typecheck
        run: npm run typecheck
