name: Check npm package registration

# Read-only public-registry check. npm Trusted Publishing cannot be
# configured for a package until its first npm publication has succeeded.
# This job does not need an npm token, GitHub environment, or publish rights.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-npm-publisher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-registration:
    name: Check whether cubrid-client exists on npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query npm registry anonymously
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --retry 2 --retry-delay 1 \
            --output "$RUNNER_TEMP/npm-package.json" \
            --write-out "%{http_code}" https://registry.npmjs.org/cubrid-client)
          case "$code" in
            200)
              echo "cubrid-client already exists on npm; check whether your npm account has maintainer access." | tee -a "$GITHUB_STEP_SUMMARY"
              node - "$RUNNER_TEMP/npm-package.json" <<'NODE'
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("npm latest published version:", p["dist-tags"]?.latest || "(none)");
          NODE
              ;;
            404)
              echo "cubrid-client does not yet exist on the public npm registry. npm Trusted Publishing cannot be set up yet. A package owner must publish the reviewed v1.2.0 artifact with npm login and npm publish once, then enable OIDC for subsequent releases. See docs/RELEASE_PROCESS.md." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Unexpected npm registry HTTP status: $code (registration not verified)"
              exit 1
              ;;
          esac
